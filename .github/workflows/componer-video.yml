name: Componer video

# Lo dispara VideosHeyGen.gs cuando HeyGen termina un video.
# Superpone placas y subtítulos, y sube el resultado a Cloudinary como final-<ID>-<VIDEO_ID>.
# Si el payload trae "animado", superpone al avatar el texto animado de HyperFrames (animado/texto.html).
on:
  repository_dispatch:
    types: [componer-video]

concurrency:
  group: componer-${{ github.event.client_payload.video_id }}
  cancel-in-progress: false

jobs:
  componer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar herramientas
        timeout-minutes: 15
        run: |
          bash "$GITHUB_WORKSPACE/.github/instalar-ffmpeg.sh"
          pip install -q playwright "opencv-python-headless<5" "mediapipe==0.10.32"
          bash "$GITHUB_WORKSPACE/.github/instalar-navegador.sh"

      - uses: actions/setup-node@v4
        if: github.event.client_payload.animado
        with:
          node-version: '22'

      - name: Preparar HyperFrames
        if: github.event.client_payload.animado
        run: npx --yes hyperframes@0.8.173 browser ensure

      - name: Componer
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          CARPETA_TRABAJO: ${{ runner.temp }}/trabajo
        run: python componer.py

      - name: Subir a Cloudinary
        env:
          FILA: ${{ github.event.client_payload.id }}
          VIDEO_ID: ${{ github.event.client_payload.video_id }}
        run: |
          curl -sS --fail-with-body \
            -F "file=@${{ runner.temp }}/trabajo/final.mp4" \
            -F "upload_preset=make-audio" \
            -F "public_id=final-${FILA}-${VIDEO_ID}" \
            https://api.cloudinary.com/v1_1/dy2gpxfsz/video/upload
          # Portada del Reel (cuadro del gancho con la cara más relajada), si componer.py la armó
          if [ -f "${{ runner.temp }}/trabajo/portada.jpg" ]; then
            curl -sS --fail-with-body \
              -F "file=@${{ runner.temp }}/trabajo/portada.jpg" \
              -F "upload_preset=make-audio" \
              -F "public_id=final-${FILA}-${VIDEO_ID}-portada" \
              https://api.cloudinary.com/v1_1/dy2gpxfsz/image/upload || echo "Aviso: no se pudo subir la portada"
          fi
