name: Componer Reel grabado

# Arma el Reel a partir de una grabación del abogado subida a la carpeta "Grabaciones Reels" de Drive
# (video/grabado.py): corta las pausas, recorta la silueta, suma gráficos, textos y subtítulos, y sube el
# resultado a Cloudinary como final-<ID>-<VIDEO_ID>.
# Lo dispara el Apps Script con el evento componer-grabado. Para pruebas, también corre al subir un archivo
# a video/pruebas/ en la rama reel-grabado (usa el último archivo modificado como payload).
on:
  repository_dispatch:
    types: [componer-grabado]
  push:
    branches: [reel-grabado]
    paths: ['video/pruebas/*.json']

concurrency:
  group: grabado-${{ github.event.client_payload.id || github.sha }}
  cancel-in-progress: false

jobs:
  componer:
    # Versión fija: con ubuntu-latest (que desde octubre de 2026 pasa a Ubuntu 26) la instalación quedó colgada el 11/11/2026
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: video
    env:
      CARPETA_DRIVE: 1D-Hn4I9FCGM78aBIcAAwnBZZOR-ZMtIz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Carpeta de trabajo
        run: echo "CARPETA_TRABAJO=$RUNNER_TEMP/trabajo" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sin apt-get: el 11/11/2026 la instalación de ffmpeg con apt quedó colgada (40 minutos, sin avisar).
      # ffmpeg viene dentro de un paquete de Python y el navegador se baja sin paquetes del sistema.
      - name: Instalar bibliotecas de Python y ffmpeg
        timeout-minutes: 8
        run: |
          pip install -q --progress-bar off playwright numpy pillow faster-whisper "rembg[cpu]" google-auth requests imageio-ffmpeg
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ffmpeg" -version | head -1

      - name: Instalar el navegador
        timeout-minutes: 6
        continue-on-error: true
        run: python -m playwright install chromium

      - name: Preparar payload
        env:
          PAYLOAD_EVENTO: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p "$CARPETA_TRABAJO"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            printf '%s' "$PAYLOAD_EVENTO" > "$CARPETA_TRABAJO/payload.json"
          else
            ARCHIVO=$(git diff --name-only HEAD~1 HEAD -- pruebas | grep '\.json$' | tail -1)
            cp "../$ARCHIVO" "$CARPETA_TRABAJO/payload.json"
          fi
          echo "FILA=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$CARPETA_TRABAJO/payload.json")" >> "$GITHUB_ENV"
          echo "VIDEO_ID=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('video_id') or 'grabado')" "$CARPETA_TRABAJO/payload.json")" >> "$GITHUB_ENV"

      - name: Bajar la grabación de Drive
        env:
          GOOGLE_DRIVE_SA: ${{ secrets.GOOGLE_DRIVE_SA }}
        run: python drive.py "$FILA" "$CARPETA_TRABAJO/origen.mov"

      - name: Componer
        env:
          ORIGEN: ${{ runner.temp }}/trabajo/origen.mov
        run: timeout 30m python grabado.py "$CARPETA_TRABAJO/payload.json"

      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ env.FILA }}
          path: |
            ${{ runner.temp }}/trabajo/final.mp4
            ${{ runner.temp }}/trabajo/informe.json
          retention-days: 7

      - name: Subir el informe a Cloudinary
        if: always()
        run: |
          [ -f "$CARPETA_TRABAJO/informe.json" ] && curl -sS \
            -F "file=@$CARPETA_TRABAJO/informe.json" \
            -F "upload_preset=make-audio" \
            -F "public_id=informe-${FILA}-${VIDEO_ID}.json" \
            https://api.cloudinary.com/v1_1/dy2gpxfsz/raw/upload || echo "Aviso: no se pudo subir el informe"

      - name: Subir a Cloudinary
        run: |
          curl -sS --fail-with-body \
            -F "file=@$CARPETA_TRABAJO/final.mp4" \
            -F "upload_preset=make-audio" \
            -F "public_id=final-${FILA}-${VIDEO_ID}" \
            https://api.cloudinary.com/v1_1/dy2gpxfsz/video/upload
