name: Publicar pieza

# Reemplaza al escenario "Post On Social Media" de Make. Lo dispara Publicador.gs (Apps Script)
# por cada pieza de la pestaña Aprobación lista para salir: post estático y carrusel en estado
# graficado, Reel con VIDEO aprobado. Publica en Instagram y en la página de Facebook (Reel nativo
# en las dos) y deja el resultado en publicaciones/<ID>/estado.json, que Publicador.gs lee para
# marcar la fila como publicado.
#
# A mano (pestaña Actions > Run workflow) sirve para probar: con modo "validar" revisa el token,
# las cuentas y que los archivos estén accesibles, sin publicar nada.
on:
  repository_dispatch:
    types: [publicar-pieza]
  workflow_dispatch:
    inputs:
      id:
        description: ID de la fila (por ejemplo T62)
        required: true
      formato:
        description: Post estatico, Carrusel o Reel
        required: true
      caption:
        description: Texto de la publicación
        default: ''
      media:
        description: Direcciones de las imágenes o del video, separadas por espacios
        required: true
      redes:
        description: Redes donde publicar
        default: IG,FB
      ubicacion:
        description: ID de Meta de la ubicación (opcional, pestaña Ubicaciones)
        default: ''
      modo:
        description: validar (no publica) o publicar
        default: validar

permissions:
  contents: write

concurrency:
  group: publicacion-${{ github.event.client_payload.id || github.event.inputs.id }}
  cancel-in-progress: false

env:
  IG_USER_ID: '17841477637615411'
  FB_PAGE_ID: '850362664826554'

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Leer la pieza
        id: datos
        env:
          PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || toJson(github.event.inputs) }}
        run: |
          python - <<'PY'
          import json, os, re
          p = json.loads(os.environ["PAYLOAD"])
          ident = str(p.get("id", "")).strip().upper()
          if not re.fullmatch(r"T\d{1,4}", ident):
              raise SystemExit(f"ID inválido: {ident!r}")
          media = p.get("media") or []
          if isinstance(media, str):
              media = media.split()
          pieza = {"id": ident, "formato": p.get("formato", ""), "caption": p.get("caption", ""),
                   "media": [m.strip() for m in media if m.strip()], "redes": p.get("redes") or "IG,FB",
                   "ubicacion": str(p.get("ubicacion") or "").strip()}
          open("pieza.json", "w", encoding="utf-8").write(json.dumps(pieza, ensure_ascii=False))
          modo = "publicar" if os.environ.get("GITHUB_EVENT_NAME") == "repository_dispatch" else str(p.get("modo") or "validar")
          es_post = str(pieza["formato"]).strip().lower().startswith("post")
          if es_post:
              # Texto de la placa animada: el que venga en "titulo" o, si no, el primer párrafo del copy
              # (es el mismo texto que lleva la placa estática).
              titulo = str(p.get("titulo") or "").strip() or str(pieza["caption"]).strip().split("\n\n")[0].strip()
              open("animado-variables.json", "w", encoding="utf-8").write(json.dumps({"titulo": titulo}, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"id={ident}\nmodo={modo}\npost={'si' if es_post else 'no'}\n")
          print(f"{ident} · {pieza['formato']} · {len(pieza['media'])} archivo(s) · modo {modo}")
          PY

      # ---------- Post estático: se publica animado ----------
      # Usa el video que dejó animar-post al graficar (publicaciones/<ID>/animado.json), si es de la
      # misma placa. Si no existe, lo arma ahora con animado/animar_post.py. Si algo de esto falla,
      # la pieza sale como siempre, con la imagen estática.
      - uses: actions/setup-node@v4
        if: steps.datos.outputs.post == 'si'
        with:
          node-version: '22'

      - name: Animar el post
        id: animar
        if: steps.datos.outputs.post == 'si'
        continue-on-error: true
        run: |
          set -e
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          pieza = json.load(open("pieza.json", encoding="utf-8"))
          titulo = json.load(open("animado-variables.json", encoding="utf-8"))["titulo"]
          previo = pathlib.Path("publicaciones") / pieza["id"] / "animado.json"
          url = ""
          if previo.exists():
              datos = json.loads(previo.read_text(encoding="utf-8"))
              if datos.get("video") and datos.get("imagen") == pieza["media"][0]:
                  url = datos["video"]
                  print("Se usa el video armado al graficar")
          if not url:
              subprocess.run("pip install -q pillow", shell=True, check=True)
              subprocess.run("command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }", shell=True, check=True)
              res = subprocess.run([sys.executable, "animado/animar_post.py", pieza["id"], pieza["media"][0], titulo],
                                   check=True, capture_output=True, text=True)
              print(res.stderr)
              url = res.stdout.strip().splitlines()[-1]
          pieza["media"] = [url] + [m for m in pieza["media"] if not m.endswith(".mp4")]
          open("pieza.json", "w", encoding="utf-8").write(json.dumps(pieza, ensure_ascii=False))
          print("Post animado:", url)
          PY

      - name: Validar
        if: steps.datos.outputs.modo != 'publicar'
        env:
          META_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python publicacion/publicar.py pieza.json "publicaciones/${{ steps.datos.outputs.id }}" --validar

      - name: Publicar en Instagram y Facebook
        id: publicar
        if: steps.datos.outputs.modo == 'publicar'
        continue-on-error: true
        env:
          META_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python publicacion/publicar.py pieza.json "publicaciones/${{ steps.datos.outputs.id }}"

      - name: Guardar el resultado
        if: steps.datos.outputs.modo == 'publicar'
        run: |
          git config user.name "publicador-bot"
          git config user.email "publicador-bot@users.noreply.github.com"
          git add "publicaciones/${{ steps.datos.outputs.id }}/estado.json"
          git commit -m "estado publicación ${{ steps.datos.outputs.id }}" || true
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          if [ "${{ steps.publicar.outcome }}" != "success" ]; then
            echo "La pieza no se pudo publicar en todas las redes: revisá publicaciones/${{ steps.datos.outputs.id }}/estado.json"
            exit 1
          fi
