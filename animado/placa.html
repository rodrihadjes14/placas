<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"titulo","type":"string","label":"Título (la frase entre asteriscos lleva la banda amarilla)","default":"Reclamá hoy contra *la ART*"},
  {"id":"apoyo","type":"string","label":"Línea de apoyo (vacío para omitirla)","default":"Asesoramiento sin cargo durante toda la tramitación"},
  {"id":"cta","type":"string","label":"Llamado a la acción, tres o cuatro palabras (vacío para omitirlo)","default":"Escribinos por WhatsApp"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Placa · Estudio Canaro</title>
<script src="assets/gsap.min.js"></script>
<style>
  /* Placa vertical de 6 s. Lenguaje de movimiento: entrada óptica (opacidad + escala + desenfoque, sin
     desplazamiento), llamado que llega después, banda amarilla en segundo golpe y salida más corta con la
     curva opuesta. Presupuesto de texto: unas 12 palabras en total (tres por segundo de lectura).
     El acercamiento lento, el grano y el sonido no van acá: los agrega terminar_placa.py sobre el video ya
     dibujado, porque el navegador mueve el texto de a píxeles enteros y un zoom lento se vería a saltos. */
  @font-face { font-family: "Bricolage"; src: url("assets/fuentes/BricolageGrotesque-variable.woff2") format("woff2"); font-weight: 200 800; }
  :root { --amarillo:#F2C230; --carbon:#1B1A19; --hueso:#F4F1EC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--carbon); }
  #root { position:relative; width:100%; height:100%; overflow:hidden; font-family:"Bricolage", Arial, sans-serif; color:var(--hueso);
          font-optical-sizing:none; font-variation-settings:"opsz" 14, "wdth" 100; }
  #root .clip { position:absolute; inset:0; }
  .luz { position:absolute; left:-200px; top:-200px; width:1480px; height:2320px;
         background:radial-gradient(circle at 32% 30%, rgba(255,244,214,.13) 0%, rgba(255,244,214,.04) 32%, rgba(0,0,0,0) 58%); }
  .vineta { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%); }
  /* Márgenes: arriba, abajo y derecha quedan libres para la interfaz de Reels */
  .bloque { position:absolute; inset:0; display:flex; flex-direction:column; gap:52px; padding:350px 190px 410px 86px; }
  .titulo { font-size:132px; line-height:1.04; font-weight:700; letter-spacing:-.02em; text-transform:uppercase; transform-origin:0 50%; }
  .h { position:relative; display:inline-block; white-space:nowrap; margin-top:10px; }
  .h .m { position:absolute; left:-22px; right:-22px; top:0; bottom:0; background:var(--amarillo); transform-origin:0 50%; }
  .h span { position:relative; }
  #root .apoyo { font-size:56px; line-height:1.35; font-weight:400; color:#B4B2A9; transform-origin:0 50%; }
  .aire { flex:1; }
  .cta { align-self:flex-start; font-size:50px; line-height:1.3; font-weight:500; background:var(--hueso); color:#111; padding:26px 36px; transform-origin:0 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="placa" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <section id="escena" class="clip" data-start="0" data-duration="6" data-track-index="0">
    <div class="luz" id="luz"></div>
    <div class="vineta"></div>
    <div class="bloque">
      <div class="titulo" id="titulo"></div>
      <div class="apoyo" id="apoyo"></div>
      <div class="aire"></div>
      <div class="cta" id="cta"></div>
    </div>
  </section>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // La frase entre asteriscos va en una sola pieza, para que la banda nunca quede partida en dos renglones
  const texto = String(v.titulo || "").replace(/\s+/g, " ").trim();
  let html = "";
  texto.split(/(\*[^*]+\*)/).forEach((p) => {
    if (/^\*.+\*$/.test(p)) html += '<span class="h"><i class="m"></i><span>' + esc(p.slice(1, -1).trim()) + "</span></span>";
    else html += esc(p);
  });
  $("titulo").innerHTML = html;
  const conApoyo = String(v.apoyo || "").trim() !== "";
  if (conApoyo) $("apoyo").textContent = String(v.apoyo).trim(); else $("apoyo").remove();
  const conCta = String(v.cta || "").trim() !== "";
  if (conCta) $("cta").textContent = String(v.cta).trim(); else $("cta").remove();

  // Achica el título si es largo, para que no invada la zona del llamado
  const tit = $("titulo");
  for (let fs = 132; fs > 84 && tit.offsetHeight > 640; fs -= 6) tit.style.fontSize = fs + "px";

  const ENTRA = "expo.out", SALE = "expo.in", FIN = 5.5;
  const desde = { opacity: 0, scale: 0.94, filter: "blur(28px)" };
  const hasta = { opacity: 1, scale: 1, filter: "blur(0px)" };
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#luz", { x: 0, y: 0 }, { x: 150, y: 110, duration: 6, ease: "none" }, 0);
  tl.fromTo("#titulo", desde, { ...hasta, duration: 0.65, ease: ENTRA }, 0);
  if (conApoyo) tl.fromTo("#apoyo", desde, { ...hasta, duration: 0.65, ease: ENTRA }, 0.11);
  if (document.querySelector("#titulo .h")) {
    tl.fromTo("#titulo .h .m", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: ENTRA }, 0.7);
    tl.fromTo("#titulo .h span", { color: "#F4F1EC" }, { color: "#111111", duration: 0.35, ease: ENTRA }, 0.7);
  }
  if (conCta) tl.fromTo("#cta", desde, { ...hasta, duration: 0.65, ease: ENTRA }, 1.1);
  const salen = ["#titulo", conApoyo ? "#apoyo" : null, conCta ? "#cta" : null].filter(Boolean);
  salen.forEach((s, i) => tl.to(s, { opacity: 0, scale: 1.04, filter: "blur(20px)", duration: 0.35, ease: SALE }, FIN + i * 0.05));
  window.__timelines["placa"] = tl;
</script>
</body>
</html>
