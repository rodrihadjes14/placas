<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"etiqueta","type":"string","label":"Etiqueta","default":"ACCIDENTE IN ITINERE"},
  {"id":"gancho","type":"string","label":"Gancho","default":"¿Te accidentaste yendo al trabajo?"},
  {"id":"grafico","type":"enum","label":"Gráfico","default":"trayecto","options":[{"value":"trayecto","label":"Trayecto con evento"},{"value":"ninguno","label":"Sin gráfico"}]},
  {"id":"origen","type":"string","label":"Origen del trayecto","default":"Casa"},
  {"id":"destino","type":"string","label":"Destino del trayecto","default":"Trabajo"},
  {"id":"evento","type":"string","label":"Evento en el trayecto","default":"Accidente"},
  {"id":"afirmacion","type":"string","label":"Afirmación (resaltado entre asteriscos)","default":"También lo cubre *la ART.*"},
  {"id":"fuente","type":"string","label":"Fuente legal","default":"Art. 6, Ley 24.557"},
  {"id":"cta_titulo","type":"string","label":"CTA, primera línea","default":"¿Te pasó?"},
  {"id":"cta_resaltado","type":"string","label":"CTA, segunda línea","default":"Escribinos."},
  {"id":"cta_detalle","type":"string","label":"CTA, detalle","default":"Te orientamos sin costo. Solo cobramos si vos cobrás."},
  {"id":"cta_boton","type":"string","label":"CTA, botón","default":"WhatsApp · link en el perfil"},
  {"id":"cta_desde","type":"number","label":"Segundo en que entra el CTA","default":8.1,"min":3,"max":120,"step":0.1},
  {"id":"duracion","type":"number","label":"Duración total (s)","default":10.5,"min":4,"max":120,"step":0.1},
  {"id":"vista_previa","type":"boolean","label":"Vista previa con avatar de muestra y subtítulos","default":true},
  {"id":"subtitulos","type":"string","label":"Subtítulos de muestra (JSON)","default":"[{\"t\":\"¿Te accidentaste yendo o volviendo del trabajo?\",\"s\":0.3,\"e\":3.4},{\"t\":\"La ART también tiene que cubrirte.\",\"s\":3.7,\"e\":6.2},{\"t\":\"Escribinos por WhatsApp.\",\"s\":8.4,\"e\":9.6}]"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Reel animado · Estudio Canaro</title>
<script src="assets/gsap.min.js"></script>
<style>
  /* Capa gráfica del Reel en pantalla dividida: gráfico arriba (0-960), avatar abajo (960-1920).
     Con vista_previa=false la mitad inferior queda transparente y se exporta en MOV con alfa
     para superponerla al video de HeyGen. */
  @font-face { font-family: "Bricolage"; src: url("assets/fuentes/BricolageGrotesque-variable.woff2") format("woff2"); font-weight: 200 800; }
  :root { --amarillo:#F2C230; --carbon:#1B1A19; --hueso:#ECE8E1; --texto:#2B2A28; --gris:#8A8682; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { position:relative; width:100%; height:100%; overflow:hidden; font-family:"Bricolage", Arial, sans-serif; color:var(--carbon); }

  .arriba { position:absolute; left:0; top:0; width:1080px; height:960px; background:var(--hueso); overflow:hidden; }
  .etiqueta { position:absolute; left:90px; top:96px; font-size:28px; font-weight:700; letter-spacing:.14em; padding:12px 22px; border:3px solid var(--carbon); border-radius:999px; }
  .gancho { position:absolute; left:90px; top:190px; width:900px; font-size:96px; line-height:1.02; font-weight:800; letter-spacing:-.03em; }
  .w { display:inline-block; margin-right:.22em; }

  .ruta { position:absolute; left:90px; top:500px; width:900px; height:200px; }
  .pista { position:absolute; left:60px; right:60px; top:58px; height:8px; background:var(--carbon); border-radius:4px; transform-origin:0 50%; }
  .nodo { position:absolute; top:22px; width:80px; height:80px; border-radius:50%; background:var(--carbon); display:flex; align-items:center; justify-content:center; }
  .nodo svg { width:40px; height:40px; fill:none; stroke:var(--hueso); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .nodo.a { left:20px; } .nodo.b { right:20px; }
  .rotulo { position:absolute; top:122px; font-size:30px; font-weight:600; color:var(--gris); }
  .rotulo.a { left:12px; } .rotulo.b { right:0; text-align:right; }
  .punto { position:absolute; left:96px; top:44px; width:36px; height:36px; border-radius:50%; background:var(--amarillo); border:6px solid var(--carbon); }
  .onda { position:absolute; left:390px; top:2px; width:120px; height:120px; border-radius:50%; border:8px solid var(--amarillo); }
  .evento { position:absolute; left:300px; top:122px; width:300px; text-align:center; font-size:30px; font-weight:800; }

  .afirmacion { position:absolute; left:90px; top:730px; width:920px; font-size:76px; line-height:1.05; font-weight:800; letter-spacing:-.025em; }
  .hl { position:relative; display:inline-block; margin-right:.22em; }
  .hl .m { position:absolute; left:-10px; right:-10px; bottom:6px; height:34px; background:var(--amarillo); transform-origin:0 50%; }
  .hl span { position:relative; }
  .fuente { position:absolute; left:90px; font-size:28px; font-weight:500; color:var(--gris); }

  .cta { position:absolute; left:0; top:0; width:1080px; height:960px; background:var(--carbon); color:var(--hueso); padding:150px 90px; }
  .cta h3 { font-size:100px; line-height:1; font-weight:800; letter-spacing:-.03em; }
  .cta h3 em { display:block; font-style:normal; color:var(--amarillo); }
  .cta p { margin-top:40px; font-size:40px; line-height:1.3; color:#CFCAC0; max-width:820px; }
  .boton { position:absolute; left:90px; bottom:120px; display:flex; align-items:center; gap:20px; background:var(--amarillo); color:var(--carbon); font-size:40px; font-weight:800; padding:26px 40px; border-radius:999px; }
  .boton svg { width:44px; height:44px; fill:none; stroke:var(--carbon); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

  .pie { position:absolute; left:0; bottom:0; width:1080px; height:120px; background:var(--hueso); display:flex; align-items:center; justify-content:space-between; padding:0 90px; }
  .pie img { height:66px; width:auto; }
  .pie .wa { display:flex; align-items:center; gap:14px; font-size:26px; font-weight:700; }
  .pie .wa i { width:46px; height:46px; border-radius:50%; background:var(--amarillo); display:flex; align-items:center; justify-content:center; }
  .pie .wa svg { width:24px; height:24px; fill:none; stroke:var(--carbon); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

  /* Solo en vista previa */
  .muestra { position:absolute; left:0; top:960px; width:1080px; height:960px; background:linear-gradient(#3A3936,#24231F); }
  .muestra .cabeza { position:absolute; left:440px; top:180px; width:200px; height:250px; border-radius:50%; background:#55534E; }
  .muestra .cuerpo { position:absolute; left:290px; top:440px; width:500px; height:520px; border-radius:240px 240px 0 0; background:#55534E; }
  .muestra p { position:absolute; left:0; right:0; top:540px; text-align:center; font-size:26px; letter-spacing:.12em; color:#8A8780; font-weight:600; }
  .subs { position:absolute; left:70px; right:70px; top:1470px; height:170px; text-align:center; font-size:66px; font-weight:800; line-height:1.15; color:#FFFFFF; text-shadow:0 4px 18px rgba(0,0,0,.55); }
  .subs .bloque { position:absolute; left:0; right:0; top:0; opacity:0; }
  .subs .bloque span { display:inline-block; margin:0 .14em; }
</style>
</head>
<body>
<div id="root" data-composition-id="reel" data-start="0" data-width="1080" data-height="1920">
  <div class="muestra" id="muestra"><div class="cabeza"></div><div class="cuerpo"></div><p>AVATAR DE HEYGEN · RECORTADO</p></div>
  <div class="subs" id="subs"></div>
  <div class="arriba">
    <div class="etiqueta" id="etiqueta"></div>
    <div class="gancho" id="gancho"></div>
    <div class="ruta" id="ruta">
      <div class="pista" id="pista"></div>
      <div class="nodo a" id="na"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>
      <div class="nodo b" id="nb"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3"/><path d="M3 13h18"/></svg></div>
      <div class="rotulo a" id="ra"></div>
      <div class="rotulo b" id="rb"></div>
      <div class="onda" id="onda"></div>
      <div class="punto" id="punto"></div>
      <div class="evento" id="evento"></div>
    </div>
    <div class="afirmacion" id="afirmacion"></div>
    <div class="fuente" id="fuente"></div>
    <div class="cta" id="cta">
      <h3 id="ctaT"></h3>
      <p id="ctaD"></p>
      <div class="boton" id="ctaB"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg><span id="ctaBt"></span></div>
    </div>
  </div>
  <div class="pie">
    <img src="assets/logo.png" alt="Canaro Legales">
    <div class="wa"><i><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg></i>Consultas</div>
  </div>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const palabras = (t, cls) => esc(t).split(/\s+/).filter(Boolean).map((w) => '<span class="' + (cls || "w") + '">' + w + "</span>").join("");
  const conResaltado = (t) => esc(t).split(/(\*[^*]+\*)/).map((p) =>
    /^\*.+\*$/.test(p) ? '<span class="hl"><i class="m"></i><span>' + p.slice(1, -1) + "</span></span>" : palabras(p)).join("");

  $("etiqueta").textContent = v.etiqueta || "";
  if (!v.etiqueta) $("etiqueta").remove();
  $("gancho").innerHTML = palabras(v.gancho);
  $("afirmacion").innerHTML = conResaltado(v.afirmacion);
  $("fuente").textContent = v.fuente || "";
  $("ra").textContent = v.origen || "";
  $("rb").textContent = v.destino || "";
  $("evento").textContent = v.evento || "";
  $("ctaT").innerHTML = esc(v.cta_titulo) + "<em>" + esc(v.cta_resaltado) + "</em>";
  $("ctaD").textContent = v.cta_detalle || "";
  $("ctaBt").textContent = v.cta_boton || "";

  // Si no hay gráfico, la afirmación sube debajo del gancho
  const conRuta = v.grafico === "trayecto";
  if (!conRuta) {
    $("ruta").remove();
    $("afirmacion").style.top = (190 + $("gancho").offsetHeight + 80) + "px";
  }
  $("fuente").style.top = ($("afirmacion").offsetTop + $("afirmacion").offsetHeight + 30) + "px";

  const E = "power3.out";
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#etiqueta", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0);
  tl.fromTo("#gancho .w", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.09, ease: E }, 0.25);
  let t = 0.25 + document.querySelectorAll("#gancho .w").length * 0.09 + 0.4;
  if (conRuta) {
    tl.fromTo("#pista", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, t)
      .fromTo("#na, #nb", { scale: 0 }, { scale: 1, duration: 0.45, stagger: 0.5, ease: "back.out(2)" }, t - 0.1)
      .fromTo("#ra, #rb", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.5 }, t + 0.1)
      .fromTo("#punto", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.2 }, t + 0.9)
      .to("#punto", { x: 336, duration: 0.9, ease: "power2.in" }, t + 0.95)
      .fromTo("#onda", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(3)" }, t + 1.8)
      .fromTo("#evento", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, t + 1.95);
    t += 2.2;
  }
  tl.fromTo("#afirmacion .w, #afirmacion .hl", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: E }, t);
  tl.fromTo("#afirmacion .m", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, t + 0.6);
  tl.fromTo("#fuente", { opacity: 0 }, { opacity: 1, duration: 0.4 }, t + 1.0);

  const desde = Number(v.cta_desde) || 8.1;
  tl.fromTo("#cta", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.inOut" }, desde);
  tl.fromTo("#ctaT, #ctaD, #ctaB", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.12, ease: E }, desde + 0.4);

  // Vista previa: avatar de muestra y subtítulos con la palabra activa en amarillo
  if (v.vista_previa) {
    let bloques = [];
    try { bloques = JSON.parse(v.subtitulos || "[]"); } catch (e) { bloques = []; }
    bloques.forEach((b, i) => {
      const el = document.createElement("div");
      el.className = "bloque";
      el.id = "sub" + i;
      el.innerHTML = palabras(b.t, "p");
      $("subs").appendChild(el);
      const ws = el.querySelectorAll(".p"), paso = (b.e - b.s) / ws.length;
      tl.set(el, { opacity: 1 }, b.s).set(el, { opacity: 0 }, b.e + 0.15);
      ws.forEach((w, k) => {
        tl.set(w, { color: "#F2C230", scale: 1.06 }, b.s + k * paso).set(w, { color: "#FFFFFF", scale: 1 }, b.s + (k + 1) * paso);
      });
    });
  } else {
    $("muestra").remove();
    $("subs").remove();
  }

  // El largo del render lo da la línea de tiempo: se extiende hasta la duración pedida
  const dur = Math.max(Number(v.duracion) || 10.5, desde + 1.6);
  tl.set({}, {}, dur);
  window.__timelines["reel"] = tl;
</script>
</body>
</html>
