<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Placa de video 1080x1920</title>
<style>
  @font-face { font-family: "Playfair"; src: url("fuentes/PlayfairDisplay-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "InterL"; src: url("fuentes/Inter-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "InterL"; src: url("fuentes/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "InterL"; src: url("fuentes/Inter-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "InterL"; src: url("fuentes/Inter-ExtraBold.otf"); font-weight: 800; }

  :root {
    --terracota: #A7644A;
    --texto: #373634;
    --gris: #878684;
    --borde: #E6E2DD;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "InterL", sans-serif; }

  /* Zona de la placa: entre el encabezado de Reels (arriba) y la cabeza del avatar (abajo) */
  .placa {
    position: absolute; left: 72px; right: 72px; top: 250px;
    max-height: 480px; box-sizing: border-box;
    background: rgba(255, 255, 255, 0.97);
    border: 2px solid var(--borde); border-radius: 32px;
    padding: 56px 64px;
  }
  .etiqueta { color: var(--terracota); font-weight: 600; font-size: 36px; margin: 0 0 8px; }
  .valor { font-family: "Playfair", serif; font-weight: 700; font-size: 150px; line-height: 1.05; color: var(--texto); margin: 0; }
  .detalle { color: var(--gris); font-size: 40px; line-height: 1.45; margin: 18px 0 0; }

  .titulo { font-family: "Playfair", serif; font-weight: 700; font-size: 68px; line-height: 1.1; color: var(--texto); margin: 0 0 34px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .items li { display: flex; gap: 28px; align-items: baseline; font-size: 40px; line-height: 1.35; color: var(--texto); margin-bottom: 24px; }
  .items li:last-child { margin-bottom: 0; }
  .items .n { color: var(--terracota); font-weight: 700; font-size: 36px; min-width: 52px; }

  .frase { font-family: "Playfair", serif; font-weight: 700; font-size: 76px; line-height: 1.15; color: var(--texto); margin: 0; }
  .barra { width: 140px; height: 10px; background: var(--terracota); margin-top: 40px; }

  /* Subtítulo: sin fondo, con contorno oscuro para que se lea sobre la camisa y sobre la pared.
     En el flujo los incrusta ffmpeg con estos mismos valores; acá sirven para la vista previa. */
  .sub {
    position: absolute; left: 140px; right: 140px; top: 1170px; text-align: center;
    font-family: "InterL", sans-serif; font-weight: 800; font-size: 58px; line-height: 1.25;
    text-shadow:
      0 0 3px #1c1b1a, 3px 3px 0 #1c1b1a, -3px -3px 0 #1c1b1a, 3px -3px 0 #1c1b1a, -3px 3px 0 #1c1b1a,
      0 4px 0 #1c1b1a, 0 -4px 0 #1c1b1a, 4px 0 0 #1c1b1a, -4px 0 0 #1c1b1a, 0 6px 12px rgba(0,0,0,.45);
  }
  .sub.amarillo { color: #FFD23F; }
  .sub.karaoke { color: #FFFFFF; }
  .sub.karaoke .activa { color: #FFD23F; }
  .sub.coral { color: #FF8A5B; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  // La placa llega como window.PLACA (la inyecta render.py). Tipos: dato, pasos, frase.
  function esc(t) { return String(t || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function dibujar(p) {
    let html = '';
    if (p.tipo === 'dato') {
      html = '<div class="placa">' +
        (p.etiqueta ? '<p class="etiqueta">' + esc(p.etiqueta) + '</p>' : '') +
        '<p class="valor">' + esc(p.valor) + '</p>' +
        (p.detalle ? '<p class="detalle">' + esc(p.detalle) + '</p>' : '') + '</div>';
    } else if (p.tipo === 'pasos') {
      html = '<div class="placa">' +
        (p.titulo ? '<p class="titulo">' + esc(p.titulo) + '</p>' : '') +
        '<ul class="items">' + (p.items || []).slice(0, 3).map((t, i) =>
          '<li><span class="n">0' + (i + 1) + '</span><span>' + esc(t) + '</span></li>').join('') +
        '</ul></div>';
    } else {
      html = '<div class="placa"><p class="frase">' + esc(p.texto) + '</p><div class="barra"></div></div>';
    }
    if (p.subtitulo_demo) {
      const palabras = String(p.subtitulo_demo).split(' ');
      const txt = palabras.map((w, i) => i === p.palabra_activa ? '<span class="activa">' + esc(w) + '</span>' : esc(w)).join(' ');
      html += '<div class="sub ' + (p.sub_estilo || 'karaoke') + '">' + txt + '</div>';
    }
    document.getElementById('raiz').innerHTML = html;
  }
  if (window.PLACA) dibujar(window.PLACA);
</script>
</body>
</html>
