<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Título del TikTok solo con b-roll · Estudio Canaro</title>
<style>
  /* Título fijo de los TikTok solo con b-roll (desde el 03/11/2026): el gancho en mayúscula sobre bandas amarillas,
     con el mismo estilo que la línea grande del texto animado de los Reels. Queda en pantalla todo el video,
     así el primer cuadro ya es la tapa. Fondo transparente: broll.py lo superpone al b-roll. */
  @font-face { font-family: "Bricolage"; src: url("fuentes/BricolageGrotesque-variable.woff2") format("woff2"); font-weight: 200 800; }
  :root { --amarillo:#F2C230; --carbon:#1B1A19; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #titulo { position:absolute; left:60px; right:60px; top:var(--arriba, 250px); display:flex; flex-direction:column;
            align-items:center; text-align:center; font-family:"Bricolage", Arial, sans-serif; color:var(--carbon);
            font-weight:800; text-transform:uppercase; line-height:1.1; }
  .banda { display:inline-block; background:var(--amarillo); border-radius:8px; padding:6px 24px 12px; margin:4px 0;
           box-shadow:0 10px 28px rgba(0,0,0,.35); }
  /* Pie con el tipo de caso y "ART" (desde el 03/11/2026): fondo blanco y letras negras, debajo del gancho */
  .pie { display:inline-block; background:#FFFFFF; color:var(--carbon); border-radius:6px; padding:10px 24px 12px;
         margin-top:14px; font-size:52px; line-height:1.05; box-shadow:0 8px 24px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div id="titulo"></div>
<script>
  // window.TITULO = {texto, tam, arriba, pie} lo pone broll.py antes de cargar la página.
  const d = window.TITULO || { texto: "Cobró $ 28.000.000 por un corte en la cara", tam: 78, arriba: 250 };
  const caja = document.getElementById("titulo");
  caja.style.setProperty("--arriba", (d.arriba || 250) + "px");
  caja.style.fontSize = (d.tam || 78) + "px";
  const ANCHO = 960 - 48;
  const medidor = document.createElement("span");
  medidor.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;";
  caja.appendChild(medidor);
  // Parte el texto en renglones que entren en el ancho, sin cortar el monto ("$ 28.000.000").
  const palabras = String(d.texto || "").replace(/\$\s+/g, "$ ").split(/[ \t\n]+/).filter(Boolean);   // \s también corta el espacio duro: así "$" queda pegado al número
  const renglones = [];
  let actual = "";
  for (const p of palabras) {
    const prueba = actual ? actual + " " + p : p;
    medidor.textContent = prueba;
    if (actual && medidor.getBoundingClientRect().width > ANCHO) { renglones.push(actual); actual = p; }
    else actual = prueba;
  }
  if (actual) renglones.push(actual);
  medidor.remove();
  for (const r of renglones) {
    const b = document.createElement("span");
    b.className = "banda";
    b.textContent = r;
    caja.appendChild(b);
  }
  if (d.pie) {
    const pie = document.createElement("span");
    pie.className = "pie";
    pie.textContent = d.pie;
    caja.appendChild(pie);
  }
  window.LISTO = true;
</script>
</body>
</html>
